name: Hourly Trading Bot

on:
  schedule:
    # Monday to Friday, every hour from 9 AM to 3 PM IST
    - cron: '0 9-15 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        run: |
          python bot.py
          
